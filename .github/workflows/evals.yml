name: evals

# Structural reachability evals + reconcile unit tests + staleness advisory.
# Everything here is pure Python 3 stdlib — no pip install, no secrets — matching
# the skill's stdlib-only contract, so the guard runs on a clean runner in seconds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Structural reachability evals (each case's answer still at its documented location)
        run: python evals/run_evals.py
      - name: Reconcile unit tests (stdlib unittest)
        run: python scripts/test_reconcile.py
      - name: Verified-stamp staleness (advisory — never fails the build)
        run: python scripts/check_staleness.py || true
